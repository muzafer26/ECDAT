# ECDAT Demo Application Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.protocol=TLSv1.3
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256

# Cryptographic Service Parameters
crypto.key-exchange.algorithm=RSA
crypto.encryption.transformation=AES/GCM/NoPadding
crypto.signature.algorithm=Ed25519

# Operational Metadata
app.system=Payment Gateway & Ingestion API
app.organization=Global FinTech Enterprise (Demo Scope)
app.environment=production
app.network-exposure=Internet-Facing Public Endpoint
app.criticality=Tier 1 Mission-Critical
